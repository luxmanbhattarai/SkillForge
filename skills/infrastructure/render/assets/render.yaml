services:
  - type: web
    name: my-app
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: my-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_API_KEY
        sync: false

databases:
  - name: my-db
    plan: starter
