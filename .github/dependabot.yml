# Dependabot configuration
#
# github-actions only: Dependabot opens PRs when a pinned action has a
# newer release, which is how the SHA pins in .github/workflows/ stay
# current. There is deliberately NO npm ecosystem entry: this repo has
# zero dependencies and no lockfile, so there is nothing for Dependabot
# to update there.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep the PR noise low: one PR per action at a time is the
    # default; no grouping config needed at this scale.
