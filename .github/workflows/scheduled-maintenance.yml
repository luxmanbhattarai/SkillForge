name: Scheduled maintenance

# Weekly maintenance jobs that need the network or report on drift
# rather than gating a PR. Each job is independent so one failure does
# not hide the others. All three are also runnable on demand via
# workflow_dispatch.

on:
  schedule:
    # Weekly, Monday 07:00 UTC — after the 06:00 security audit.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Least privilege: these jobs only read the repository. No custom
# secrets are used; the upstream job uses the default GITHUB_TOKEN
# (read-only here) and works unauthenticated too.
permissions:
  contents: read

# Serialize maintenance runs (never cancel): the weekly online link
# check fires a 600+ URL burst, and two overlapping bursts would
# double the rate-limit pressure on checked hosts. A manual dispatch
# while a run is in flight queues behind it instead of killing it.
concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  online-links:
    # Online documentation link verification (audit finding L-11):
    # re-verifies every external URL, including the documented
    # exception entries, which are printed as SKIPPED lines in the log
    # so a genuinely dead exception is visible on review.
    name: Verify links online
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Verify external links online
        run: node scripts/check-links.mjs --online

  stale-verification:
    # Stale-verification detection: lists skills whose last_verified
    # date is older than 180 days. A failing run means skills are due
    # for re-verification against current official docs.
    name: Detect stale skill verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: List skills not verified in the last 180 days
        run: npm run query -- stale --days 180

  freshness:
    # Automated skill freshness scoring (Phase 7): scores every
    # skill on verification recency, status, post-verification
    # edits, link health, and documentation completeness, and bands
    # it FRESH / AGING / STALE / CRITICAL / UNVERIFIED (see
    # ai/quality/SKILL-FRESHNESS.md). The job fails only on CRITICAL
    # — a skill unverified for over 365 days, one full year. The
    # threshold is a year rather than the 180-day stale line because
    # STALE skills today are the known needs-correction upstream
    # skills, whose fixes belong upstream: failing the weekly job on
    # them would be noise the maintainers cannot act on. STALE
    # skills are still listed in the job log for review.
    name: Score skill freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Score freshness, failing on critical staleness
        run: npm run freshness -- --fail-on-critical

  upstream:
    # Upstream source update monitoring: compares each upstream
    # vendor repo's latest default-branch commit against the pin in
    # sources/imported-skills.md and reports drift. Monitoring, not
    # gating — the script exits 0 even when upstreams have moved.
    name: Monitor upstream sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Check upstream repos for new commits
        env:
          # The default token only; the script also works without it
          # (unauthenticated GitHub API, 60 requests/hour — this job
          # makes ~18). It is passed here for the higher rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:upstream

      # Phase 15: the same check in report mode — a JSON change
      # report (drift, new commits, flagged files) kept as a
      # run artifact for 30 days so a maintainer can review it
      # before deciding on a re-import. Report mode only: no
      # --record-state (the checkout is fresh each run and this job
      # is read-only; recording state is a maintainer step after
      # review) and no auto-commit.
      - name: Generate upstream change report (JSON)
        env:
          # The default token only; the script also works without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-upstream.mjs --out upstream-report.json

      - name: Upload upstream change report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-change-report
          path: upstream-report.json
          retention-days: 30
