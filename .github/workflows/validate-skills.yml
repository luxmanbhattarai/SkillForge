name: Validate skills

# PR validation: every check in package.json that can run locally runs
# here, so a green PR means the library is valid, de-duplicated,
# source-checked, quality-scored, regression-tested, and in sync with
# the registry. See ai/phase10/NOTES.md for the full CI map.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository and run local
# checks. No secrets are used anywhere in this workflow, so
# pull_request runs from forks are safe.
permissions:
  contents: read

# One run per ref at a time: a new push to a PR cancels the stale run
# (fast feedback, no queue pile-up), but runs on main are never
# cancelled — the main-branch signal must always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    # The main validation job runs on Node 24: package.json claims
    # engines >= 24, so CI exercises the supported floor.
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Validate skill frontmatter and structure
        run: npm run validate

      - name: Check frontmatter completeness
        run: npm run check:frontmatter

      - name: Check for duplicate skills
        run: npm run check:duplicates

      - name: Check sources and licenses
        run: npm run check:sources

      - name: Check agents and workflows
        run: npm run check:agents

      - name: Score skill quality
        run: npm run score

      - name: Run regression tests
        run: npm test

  registry:
    # Registry validation: the committed registry must match what the
    # generator produces, and must pass schema validation. Runs on
    # Node 20 only; generation is deterministic (see
    # ai/decisions/2026-11-20-registry-determinism.md), so one version
    # is enough.
    name: Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Validate registry schema and contents
        run: npm run check:registry

      - name: Regenerate registry
        run: npm run registry

      - name: Fail if registry differs from generated output
        run: |
          if ! git diff --exit-code --quiet registry/; then
            echo "::error::The committed registry is out of date."
            echo "Fix: run 'npm run registry' locally and commit the result."
            git diff --stat registry/
            exit 1
          fi

  evals:
    # Behavioral evaluation of the library with the deterministic mock
    # provider (the default: no LLM APIs, no keys, no network). A
    # model-provider run needs credentials and is not run in CI.
    name: Behavioral evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Run behavioral evals (mock provider)
        run: npm run evals

  windows:
    # Windows leg (Stage D, L-Win): the installer is the
    # platform-sensitive surface (symlinks, home-directory
    # resolution, line endings), so Windows runs the full
    # regression suite plus the validators that are Windows-safe.
    #
    # ADVISORY, not gating (continue-on-error): the suite is not
    # yet green on Windows. Three known gaps, all outside this
    # file — see ai/remediation/stage-d/ci-validation.md:
    #   W-1  test-support/helpers.mjs runCli sets HOME only; the installer
    #        resolves home via os.homedir(), which reads
    #        USERPROFILE on Windows, so user-scope installer tests
    #        fail and write into the real runner profile.
    #   W-2  scripts/security-scan.mjs compares backslash
    #        relative paths against POSIX exception/skip prefixes,
    #        so no exception matches on Windows (check:security
    #        and scanner.test.mjs fail there).
    #   W-3  scripts/generate-registry.mjs and
    #        scripts/validate-registry.mjs emit/compare native
    #        relative paths, so registry tests fail on Windows.
    #   W-4  Link-mode install/backup on Windows depends on the
    #        junction fallback in scripts/install/links.mjs (A-11):
    #        a directory symlink needs Developer Mode or admin
    #        rights, a junction needs neither. Whether that module
    #        is present and correct is verified by the --link tests
    #        themselves on the first run; Developer Mode status on
    #        the runner image is unverified from here.
    # Remove continue-on-error (and add this job to the required
    # branch-protection checks) once the leg is green for real.
    # Until then, do NOT require the "Windows (Node 20)" check.
    #
    # Deliberately NOT run here: check:security (W-2),
    # check:links (the upstream exclusion is a POSIX-prefix match
    # and silently stops excluding on Windows), score (the
    # category fallback splits on '/'), check:registry and the
    # registry diff (W-3), evals (covered on Ubuntu; the mock
    # provider adds no Windows signal). All are covered by the
    # Ubuntu jobs in this workflow.
    name: Windows (Node 20)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        # Git Bash ships on windows-latest; bash keeps step
        # behavior identical to the Ubuntu jobs.
        shell: bash
    steps:
      # Git for Windows defaults core.autocrlf to true, which
      # would check out CRLF line endings. The frontmatter parser
      # tolerates CRLF, but checking out LF removes the whole
      # class of line-ending divergence from this leg.
      - name: Disable CRLF conversion for this checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Validate skill frontmatter and structure
        run: npm run validate

      - name: Check frontmatter completeness
        run: npm run check:frontmatter

      - name: Run regression tests
        run: npm test
