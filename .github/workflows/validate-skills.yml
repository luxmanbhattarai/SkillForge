name: Validate skills

# PR validation: every check in package.json that can run locally runs
# here, so a green PR means the library is valid, de-duplicated,
# source-checked, quality-scored, regression-tested, and in sync with
# the registry. See ai/phase10/NOTES.md for the full CI map.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository and run local
# checks. No secrets are used anywhere in this workflow, so
# pull_request runs from forks are safe.
permissions:
  contents: read

# One run per ref at a time: a new push to a PR cancels the stale run
# (fast feedback, no queue pile-up), but runs on main are never
# cancelled — the main-branch signal must always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    # The main validation job runs on Node 24: package.json claims
    # engines >= 24, so CI exercises the supported floor.
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Validate skill frontmatter and structure
        run: npm run validate

      - name: Check frontmatter completeness
        run: npm run check:frontmatter

      - name: Check for duplicate skills
        run: npm run check:duplicates

      - name: Check sources and licenses
        run: npm run check:sources

      - name: Check agents and workflows
        run: npm run check:agents

      - name: Score skill quality
        run: npm run score

      - name: Run regression tests
        # Tee the spec output so the next step can verify the recorded
        # runner counts in ai/PROJECT-STATUS.json. pipefail keeps a
        # failing suite failing this step (tee alone would mask it).
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt

      - name: Verify test counts match canonical status
        run: node scripts/check-status.mjs --verify-tests /tmp/test-output.txt

  registry:
    # Registry validation: the committed registry must match what the
    # generator produces, and must pass schema validation. Runs on
    # Node 24 only; generation is deterministic (see
    # ai/decisions/2026-11-20-registry-determinism.md), so one version
    # is enough.
    name: Registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Validate registry schema and contents
        run: npm run check:registry

      - name: Regenerate registry
        run: npm run registry

      - name: Fail if registry differs from generated output
        run: |
          if ! git diff --exit-code --quiet registry/; then
            echo "::error::The committed registry is out of date."
            echo "Fix: run 'npm run registry' locally and commit the result."
            git diff --stat registry/
            exit 1
          fi

      - name: Regenerate audit report
        run: npm run report

      - name: Fail if audit report differs from generated output
        # A2-11: report.json / AUDIT-REPORT.md are generated from
        # the registry; without this gate they could go stale
        # silently after a registry change.
        run: |
          if ! git diff --exit-code --quiet -- report.json AUDIT-REPORT.md; then
            echo "::error::The committed audit report is out of date."
            echo "Fix: run 'npm run report' locally and commit the result."
            git diff --stat -- report.json AUDIT-REPORT.md
            exit 1
          fi

  evals:
    # Behavioral evaluation of the library with the deterministic mock
    # provider (the default: no LLM APIs, no keys, no network). A
    # model-provider run needs credentials and is not run in CI.
    name: Behavioral evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Run behavioral evals (mock provider)
        run: npm run evals

  windows:
    # Windows leg (Stage D, L-Win): the installer is the
    # platform-sensitive surface (symlinks, home-directory
    # resolution, line endings), so Windows runs the full
    # regression suite plus the validators that are Windows-safe.
    #
    # GATING (promoted 2026-11-21): the leg went green on a real
    # Windows runner (PR #1, run 44933250315: 250/255 pass,
    # 0 fail, 5 POSIX-only skipped). The gaps that made it
    # advisory are closed: W-1/W-2/W-3 were fixed in Stage D
    # (USERPROFILE sandboxing, POSIX path normalization in the
    # scanner, registry generator/validator, link checker, and
    # scorer), W-4 (junction fallback) is proven by the --link
    # tests passing on the real runner, and the validator's
    # Windows path bug plus 7 Windows-only test failures were
    # fixed from the first real runs (see ai/PROJECT-STATUS.md).
    # The leg is a RECOMMENDED required branch-protection check
    # (ai/phase10/NOTES.md) — recommended, not in force: branch
    # protection is NOT currently enabled on main (audit finding
    # A4-02), so today the leg gates the run — a failure fails the
    # run — but does not block merging. Enabling protection is an
    # owner decision (it blocks direct pushes to main).
    #
    # Deliberately NOT run here: check:security, check:links,
    # score, check:registry and the registry diff, evals. All are
    # covered by the Ubuntu jobs in this workflow; Windows runs
    # the platform-sensitive surface (validate, frontmatter, the
    # full regression suite). The Windows path bugs that once
    # excluded these checks (W-2, POSIX-prefix matching) were
    # fixed in Stage D.
    #
    name: Windows (Node 24)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Git Bash ships on windows-latest; bash keeps step
        # behavior identical to the Ubuntu jobs.
        shell: bash
    steps:
      # Git for Windows defaults core.autocrlf to true, which
      # would check out CRLF line endings. The frontmatter parser
      # tolerates CRLF, but checking out LF removes the whole
      # class of line-ending divergence from this leg.
      - name: Disable CRLF conversion for this checkout
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Validate skill frontmatter and structure
        run: npm run validate

      - name: Check frontmatter completeness
        run: npm run check:frontmatter

      - name: Run regression tests
        run: npm test
