name: Lint

# Markdown linting and offline link checks. The online link check runs
# on a schedule instead (scheduled-maintenance.yml) because it hits the
# network and is slow; see ai/phase10/NOTES.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository and run local
# checks. No secrets are used anywhere in this workflow, so
# pull_request runs from forks are safe.
permissions:
  contents: read

# One run per ref at a time: a new push to a PR cancels the stale run,
# but runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          # No cache: this repo has zero dependencies and no lockfile,
          # so there is nothing to cache.

      - name: Check frontmatter
        run: npm run check:frontmatter

      - name: Check links (offline)
        run: npm run check:links

      - name: Check trailing whitespace in Markdown
        # Upstream skills are imported verbatim and never edited, so
        # they are excluded from this check.
        run: |
          if find . -name '*.md' -not -path './skills/upstream/*' -print0 \
            | xargs -0 grep -n ' $'; then
            echo "Trailing whitespace found in Markdown files."
            exit 1
          fi
