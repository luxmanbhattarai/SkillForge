name: CodeQL

# Static analysis with GitHub CodeQL (advanced setup via this workflow
# file — see ai/decisions/2026-11-20-codeql-advanced-setup.md). Do NOT
# also enable CodeQL "default setup" in repo settings; the two
# configurations conflict. The weekly run picks up new CodeQL queries
# even without code changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Thursday 06:30 UTC (staggered from the Monday jobs)
    - cron: "30 6 * * 4"

# Least privilege for CodeQL: contents:read to check out the code,
# security-events:write to upload results, actions:read as required by
# the CodeQL action. No secrets are used; the default GITHUB_TOKEN is
# scoped by these permissions.
permissions:
  actions: read
  contents: read
  security-events: write

# One run per ref at a time: a new push to a PR cancels the stale run,
# but runs on main are never cancelled (the weekly schedule also runs
# on main, so it is never cancelled either). Cancelling a stale PR
# analysis is harmless — CodeQL uploads results only on completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # JavaScript covers the .mjs/.js scripts; TypeScript covers any
        # .ts examples in skills.
        language: [javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}

      # No autobuild step: JavaScript/TypeScript analysis does not
      # require a build.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
